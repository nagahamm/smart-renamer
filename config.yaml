# 1. フォルダ設定
directories:
  watch_dir: "~/Desktop"                  # スクショのデフォルト保存先
  save_dir: "~/Documents/Screenshots"     # リネーム後の移動先

# 2. UI・挙動設定
ui:
  timeout_seconds: 10                     # ポップアップを自動で閉じて保存するまでの秒数
  idle_timeout_minutes: 30                # この時間スクショが無ければ常駐を終了（0で無効）

# 3. LLM
llm:
  # 上限やコストを考慮して、高速・軽量な gemini-3.1-flash-lite を採用
  model: "gemini-3.1-flash-lite"
  # APIリクエストが詰まってPythonが固まったままファイルを触れなくなるのを防ぐためのタイムアウト（秒）
  timeout_seconds: 15
  error_fallback_names:
    - "Manual_Rename"
    - "Screenshot_Error"
    - "API_Failed"

# 4. LLM リネーム規則設定
llm_rules:
  prompt_template: >
    あなたは優秀なファイル名生成アシスタントです。
    提供されたOCRテキストを解析し、以下の【命名規則】に厳密に従ってファイル名を生成してください。
    拡張子は不要です。スペースはアンダースコア(_)に変換し、大項目・小項目はダブルアンダースコア(__)、サフィックスはアンダースコア(_)で区切ってください。

    【命名規則のフォーマット（内容に応じて以下から選択）】

    1. 領収書・明細・契約系（基本）
    ・ルール: YYYY-MM-DD__[会社またはカテゴリ]__[金額または内容]_[サフィックス]
    ・期間がある場合: YYYY-MM-DD.YYYY-MM-DD__[会社]__[金額]
    ・金額の書式: 整数部は最低4桁のゼロ埋め（例: 0120）。外貨は小数点以下2桁を含め（例: 0120.00AUD）、日本円（JPY）は原則小数点以下を省略（例: 11500JPY）。

    2. 投資・資産運用・企業分析系（企業ごとにまとめる）
    ・決算資料・決算短信など、四半期・会計期間に紐づく内容の場合:
      ルール: YYYY-Q[四半期]-FY[決算月]__[銘柄コード]_[企業名]__[内容]_[サフィックス]
      例: 2025-Q2-FY3__8801_三井不動産__決算短信_Statement

    ・決算に関係ない日次の内容（株価チェック、ニュース、注文執行、配当通知など）の場合:
      ルール: YYYY-MM-DD__[銘柄コード]_[企業名]__[内容]_[サフィックス]
      例: 2025-07-22__8801_三井不動産__株価チェック_Capture

    ・サフィックス:
      _Dividend: 配当金、利金
      _Executed: 約定済み、注文完了
      _Statement: 取引明細、運用報告書

    3. 自動車関連
    ・ルール: YYYY-MM-DD__Car__[車種]_[内容]_[金額]_[サフィックス]
    ・例: 2026-05-06__Car__Camry_ACV40R_整備工場手配部品_0450.00AUD_Receipt

    4. 財務・企業分析系（FS）
    ・ルール: [証券コード4桁]_FY[決算月]-[年度]-[四半期]__[企業名]

    5. 学習・資格・体系的ドキュメント
    ・ルール: YYYY-MM__[資格名]__[資料の種別]_[サフィックス]

    ・資料の種別（中項目）:
      サンプル問題: Sample (例: Sample_Exam, Sample_Solution)
      過去問: Past
      模試・予想問題: Mock
      通常の試験問題: Exam (種別がない場合は省略可)

    ・サフィックス（学習サイクルの順）:
      _Exam: 問題用紙
      _Draft: 下書き・計算用紙
      _Answer: 自分の答案
      _Solution: 模範解答・解説

    6. 旅行（Travel）
    ・ルール: YYYY-MM-DD__Travel__[内容やファイル名]_[サフィックス]
    ・例: 2026-05-22__Travel__Boarding_pass_Capture

    7. 雑誌・定期刊行物からの切り抜き
    ・ルール: YYYY-MM-DD号__[誌名またはメディア名]__[記事タイトル]_Clip
    ・例: 2025-03-08号__週刊東洋経済__40代・50代のための稼げるスキル大全_Clip
     ※ 連番は付けない（同じ号から複数保存する場合はユーザーが後で手動で付与する）

    8. その他汎用（Other）
    ・ルール: YYYY-MM-DD__[推測されるカテゴリ]__[内容やファイル名]_[サフィックス]

    ・ブラウザ（Chrome/Safari等）で見ているWebサービス名（Gemini, YouTube, GitHub, Notion 等）が分かる場合は、[推測されるカテゴリ] の代わりにそのサービス名を大項目にしてください。

    ・メディア・音楽アプリ（Spotify等）の場合は、「サービス名__アーティスト名__曲名」のようにコンテンツを明確にしてください。
    ・例: 2026-07-21__Spotify__YOASOBI__アイドル_Capture
    ・一般的なアプリ・デスクトップの場合: YYYY-MM-DD__[アプリ名]__[内容]_[サフィックス]

    【カテゴリタグ一覧】
    内容に応じて以下のカテゴリ名を使用してください。
    Admin: 行政手続き
    Car: 自動車関連
    Education: 卒業証明書、学校関連
    Licence: 資格（フォークリフト等）
    Visa: ビザ関連
    Work: 契約書、雇用関係、給与
    (※その他、内容に応じた適切な英単語)

    【サフィックス（書類の役割や状態を表す接尾辞）】
    状況に応じて以下から最も適切なものを選択してください。（原本や未記入の場合は不要）

    ・ステータス・編集状態
      _Redline または _Marked: 修正入り、添削済み
      _Signed: 署名済み

    ・証明・完了記録
      _Confirmation: 手続きの完了画面、確認画面
      _Receipt: 領収書、受付証

    ・資料の構成・性質
      _Appendix または _Attachment: 付録、添付資料
      _Clip: ニュースや記事の切り抜き
      _Summary: 要約

    ・汎用（デフォルト）
      _Capture: 上記のどれにも該当しない一般的なスクリーンショット

    【ナンバリング（映像・進行管理用）】
    文脈に応じて以下から適切な区切り文字を使用してください（例: Act_8, Phase_08）
    Act, Chapter (Ch.), Cut, Ep, No, Part, Phase, Scene, Stage, Step, Vol

